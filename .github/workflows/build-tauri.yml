name: "Build Tchap Tauri App"

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      releaseId:
        required: false
        type: string
      args:
        required: false
        type: string
      env:
        required: false
        type: string
        default: prod
      onPR:
        required: false
        type: boolean
        default: false
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: true
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: true

jobs:
# Building the webapp
  build-webapp:
    uses: ./.github/workflows/build-webapp.yml
    with:
      platform: ${{ inputs.platform }}
      env: ${{ inputs.env }}

  build-rust:
    runs-on: ${{ inputs.platform }}
    needs: build-webapp
    steps:
      - uses: actions/checkout@v4

      # We need to empty the src directory because the build-webapp workflow will copy the webapp in it
      - name: Empty src directory
        shell: bash
        run: |
          rm -rf src
        if: inputs.platform != 'windows-latest'

      - name: Empty src directory (Windows)
        shell: cmd
        run: |
          if exist src rmdir /s /q src
        if: inputs.platform == 'windows-latest'

      # The result of the build-webapp workflow is an artifact that we need to download
      - name: Download webapp artifact
        uses: actions/download-artifact@v4
        with:
          name: webapp_${{ github.run_id }}_${{ inputs.env }}
          path: src/

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
          targets: ${{ inputs.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies for Linux
        if: inputs.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          echo "--- Installing linux dependencies"
          sudo apt-get install -y \
            libgtk-4-dev \
            libx11-dev libxkbcommon-dev libgbm-dev \
            libnss3 libnspr4 libasound2t64 libxss1 libxtst6 \
            libatk1.0-0t64 libatk-bridge2.0-0t64 libatspi2.0-0t64 \
            libclang-dev libssl-dev libdbus-1-dev \
            librsvg2-dev \
            patchelf rpm strace xvfb xauth zenity
          echo "PKG_CONFIG_PATH=/usr/lib/pkgconfig:/usr/share/pkgconfig:/usr/lib/x86_64-linux-gnu/pkgconfig" >> $GITHUB_ENV
          echo "Finish installing deps"

      - name: Install pinned Tauri 3 CLI
        run: cargo install tauri-cli --version 3.0.0-alpha.2 --locked

      - name: Prepare asset name pattern for normal version
        id: create-pattern-updater
        run: |
          PATTERN="Tchap-${{ inputs.env }}_[version]_[arch][ext]"
          echo "PATTERN=$PATTERN" >> $GITHUB_OUTPUT
          echo "Generated pattern: $PATTERN"
        shell: bash

      - name: Prepare asset name pattern for no updater version
        id: create-pattern-no-updater
        run: |
          PATTERN="Tchap-${{ inputs.env }}_[version]_[arch]_no_updater[ext]"
          echo "PATTERN_NO_UPDATER=$PATTERN" >> $GITHUB_OUTPUT
          echo "Generated no updater pattern: $PATTERN"
        shell: bash

      # Uploading the tauri app to a release
      - name: Create Tauri app artifacts for MacOS and Windows
        if: inputs.platform != 'ubuntu-24.04'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: cargo tauri
          releaseId: ${{ inputs.releaseId }}
          args: ${{ inputs.args }}
          uploadWorkflowArtifacts: ${{ inputs.onPR }}
          releaseAssetNamePattern: ${{ steps.create-pattern-updater.outputs.PATTERN }}
          workflowArtifactNamePattern: ${{ steps.create-pattern-updater.outputs.PATTERN }}

      - name: Create Tauri app for linux
        if: inputs.platform == 'ubuntu-24.04'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NO_STRIP: true
          # quick-sharun's default anylinux.c URL returned 404 during local testing.
          ANYLINUX_LIB_SOURCE: https://raw.githubusercontent.com/FabianLars/Anylinux-AppImages/df9cd3246ccbcf61eb22fc321a52277351047b4b/useful-tools/lib/anylinux.c
        with:
          tauriScript: cargo tauri
          releaseId: ${{ inputs.releaseId }}
          args: ${{ inputs.args }}
          uploadWorkflowArtifacts: ${{ inputs.onPR }}
          releaseAssetNamePattern: ${{ steps.create-pattern-updater.outputs.PATTERN }}
          workflowArtifactNamePattern: ${{ steps.create-pattern-updater.outputs.PATTERN }}

      - name: Create Windows app without updater
        if: inputs.platform == 'windows-latest'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: cargo tauri
          releaseId: ${{ inputs.releaseId }}
          args: --target x86_64-pc-windows-msvc --config src-tauri/tauri.conf.noupdater-windows.json --features no-updater
          releaseAssetNamePattern: ${{ steps.create-pattern-no-updater.outputs.PATTERN_NO_UPDATER }}
          workflowArtifactNamePattern: ${{ steps.create-pattern-no-updater.outputs.PATTERN_NO_UPDATER }}
          uploadWorkflowArtifacts: true
          uploadUpdaterJson: false
