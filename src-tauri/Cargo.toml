[package]
name = "tchap-desktop"
version = "4.21.5"
description = "Desktop app of tchap web."
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tchap_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "3.0.0-alpha.1", features = [] }

[dependencies]
tauri = { version = "3.0.0-alpha.2", features = ["devtools", "tray-icon", "image-png"] }
tauri-plugin-opener = "3.0.0-alpha.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-fs = "3.0.0-alpha.1"
tauri-plugin-notification = "3.0.0-alpha.1"
tauri-plugin-persisted-scope = "3.0.0-alpha.1"
# Use the portal backend to avoid mixing the dialog plugin's GTK3 backend with CEF's GTK4.
# Linux runtime prerequisites: Zenity and an XDG Desktop Portal backend.
# (ref: https://github.com/tauri-apps/plugins-workspace/tree/v3/plugins/dialog#linux-xdg-desktop-portal-support)
tauri-plugin-dialog = { version = "3.0.0-alpha.1", default-features = false, features = ["xdg-portal"] }
seshat = { git = "https://github.com/tchapgouv/seshat.git", branch = "main_tchap", features = ["bundled-sqlcipher"] }
thiserror = "2.0.11"
anyhow = "1.0.97"
uuid = "1.15.1"
rand = "0.9.0"
tauri-plugin-deep-link = "3.0.0-alpha.1"
tauri-plugin-shell = "3.0.0-alpha.1"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service"] }
tauri-plugin-process = "3.0.0-alpha.1"
tauri-plugin-store = "3.0.0-alpha.1"

[features]
# by default Tauri runs in production mode
# when `tauri dev` runs it is executed with `cargo run --no-default-features` if `devPath` is an URL
default = [ "custom-protocol" ]
# this feature is used used for production builds where `devPath` points to the filesystem
# DO NOT remove this
custom-protocol = [ "tauri/custom-protocol" ]
no-updater = []

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "3.0.0-alpha.1"
tauri-plugin-single-instance = { version = "3.0.0-alpha.0", features = ["deep-link"] }
tauri-plugin-updater = "3.0.0-alpha.1"
tauri-plugin-window-state = "3.0.0-alpha.1"

[target.'cfg(target_os = "linux")'.dependencies]
tauri-runtime-cef = { version = "3.0.0-alpha.2", features = ["devtools"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
tauri-runtime-wry = { version = "3.0.0-alpha.2", features = ["devtools"] }
